apiVersion: v1
kind: Service
metadata:
  name: examen-devops-service
spec:
  type: NodePort
  selector:
    app: ticket-api  # This must match the label in your k8s-deployment.yml template
  ports:
    - protocol: TCP
      port: 8000       # The port inside the cluster
      targetPort: 8000 # The port your FastAPI app runs on inside the container
      nodePort: 30080  # Fixed port for Docker Desktop localhost access
